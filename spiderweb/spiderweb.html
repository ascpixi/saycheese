<title>spiderweb by @ascpixi</title>
<style>
  button {
    position: fixed;
    inset: 0;
    font: 4em Consolas, monospace;
    background: #000;
    color: lime;
    cursor: pointer;
  }
</style>

<button onclick="start()"><i>click to play</i></button>

<script>
  // A0 = #
  // A#0 = $
  // B0 = %

  // C1 = &       C2 = 2        C3 = >        C4 = J
  // C#1 = '      C#2 = 3       C#3 = ?       C#4 = K
  // D1 = (       D2 = 4        D3 = @        D4 = L
  // D#1 = )      D#2 = 5       D#3 = A       D#4 = M
  // E1 = *       E2 = 6        E3 = B        E4 = N
  // F1 = +       F2 = 7        F3 = C        F4 = O
  // F#1 = ,      F#2 = 8       F#3 = D       F#4 = P
  // G1 = -       G2 = 9        G3 = E        G4 = Q
  // G#1 = .      G#2 = :       G#3 = F       G#4 = R
  // A1 = /       A2 = ;        A3 = G        A4 = S
  // A#1 = 0      A#2 = <       A#3 = H       A#4 = T
  // B1 = 1       B2 = =        B3 = = I

  const a = "%18=B=8B8G@=F@GD";
  const w = "1;@;4@;84;?48?";
  const b = "--" + w;
  const c = "#/" + w;
  const m = a + a + "#/6?D?6D?;6.B?;B#/6;?;6??;6.=6;=" + b + b + c + c;

  function start() {
    const ctx = new AudioContext();
    const master = ctx.createGain();
    master.gain.value = 0.3;
    const d = ctx.destination;
    const osc = ctx.createOscillator();
    const bassOsc = ctx.createOscillator();
    const dly = new DelayNode(ctx, { delayTime: 0.25 })
    osc.type = "square";
    bassOsc.type = "triangle";
    osc.connect(master);

    const g = ctx.createGain();
    bassOsc.connect(g);
    g.gain.value = 0.5;
    g.connect(d);

    master.connect(dly);
    dly.connect(d);
    dly.connect(master);

    osc.start();
    bassOsc.start();

    /** @param {string} v */
    const freq = (v) => {
      return 440 * Math.pow(2, (v - 59) / 12);
    };

    let i = 0;
    setInterval(() => {
      i = ++i % m.length;
      osc.frequency.value = freq(m.charCodeAt(i));
      bassOsc.frequency.value = freq("1/-/".charCodeAt((i - 2) / 32)) / 4;
    }, 150);

    setInterval(() => {
      const s = Math.sin(Date.now() / 2000) / -2 + .5;
      document.body.style = `background:repeating-conic-gradient(
        lime 0deg,
        #000 ${0.1 * s + (Math.sin(Date.now() / 4000) / 2 + 0.5) * .08}deg,
        red ${0.2 * s + 0.02}deg
      )`;
    }, 16);

    document.querySelector("button").remove(); // this should be replaced w/ "this.remove()" when minifying
  }
</script>
